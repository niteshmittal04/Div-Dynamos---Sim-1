<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Robot Simulator with Improved Robot Design</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    /* Info panel in the top-left */
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 4px;
      z-index: 1;
    }
    /* Control panel in the top-right */
    #controlPanel {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 4px;
      z-index: 1;
    }
    #controlPanel label, #controlPanel span {
      font-size: 14px;
    }
  </style>
  <!-- Import map to resolve "three" module specifier -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="info">
    <strong>Robot Simulator</strong><br>
    Use the controls to start, stop, or reset the navigation.
  </div>
  <div id="controlPanel">
    <button id="startNavBtn">Start Navigation</button>
    <button id="stopNavBtn">Stop Navigation</button>
    <button id="resetBtn">Reset</button>
    <span style="margin-left: 20px;">Collisions: <span id="collisionCount">0</span></span>
  </div>
  <div id="hud" style="display: none;"></div>

  <!-- Use module script for Three.js and OrbitControls -->
 
  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

  // === SIMULATION STATE ===
  const simState = {
    active: false,
    collisionCount: 0,
    goalPosition: { x: 40, z: 40 }
  };

  // === UI Elements & Event Listeners ===
  const startNavBtn = document.getElementById('startNavBtn');
  const stopNavBtn = document.getElementById('stopNavBtn');
  const resetBtn = document.getElementById('resetBtn');
  const collisionCountEl = document.getElementById('collisionCount');

  startNavBtn.addEventListener('click', () => {
    simState.active = true;
    movingObstacles.enabled = true;
  });

  stopNavBtn.addEventListener('click', () => {
    simState.active = false;
    movingObstacles.enabled = false;
  });

  resetBtn.addEventListener('click', () => {
    resetSimulation();
  });

  // === SETUP: Scene, Camera, Renderer ===
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x444444);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 20, 30);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  // === FLOOR & ENV ===
  const floorGeo = new THREE.PlaneGeometry(100, 100);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Obstacles & helpers
  let obstacles = [];
  const obstacleGeometry = new THREE.BoxGeometry(4, 4, 4);
  const obstacleMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00 });

  function addObstacleAt(x, y=2, z=0) {
    const obs = new THREE.Mesh(obstacleGeometry, obstacleMaterial);
    obs.position.set(x, y, z);
    obs.boundingBox = new THREE.Box3().setFromObject(obs);
    scene.add(obs);
    obstacles.push(obs);
    return obs;
  }

  function updateCollisionHUD() { 
    collisionCountEl.textContent = String(simState.collisionCount); 
  }
  updateCollisionHUD();


  // Initial obstacles
  const obstaclePositions = [
    { x: 10, y: 2, z: 0 }, { x: -10, y: 2, z: -10 }, { x: 0, y: 2, z: 10 },
    { x: 15, y: 2, z: 5 }, { x: -12, y: 2, z: 12 }, { x: 5, y: 2, z: -15 },
    { x: -8, y: 2, z: -5 }, { x: 20, y: 2, z: 20 }, { x: -18, y: 2, z: -3 },
    { x: 13, y: 2, z: -7 }, { x: -7, y: 2, z: 8 }, { x: 18, y: 2, z: -10 },
    { x: -5, y: 2, z: 17 }, { x: 12, y: 2, z: 13 }, { x: -16, y: 2, z: -14 },
    { x: 3, y: 2, z: -12 }, { x: -14, y: 2, z: 0 }, { x: 7, y: 2, z: 16 },
    { x: -20, y: 2, z: 10 }, { x: 0, y: 2, z: -20 }, { x: 4, y: 2, z: 4 }
  ];
  obstaclePositions.forEach(p => addObstacleAt(p.x, p.y, p.z));

  // === ROBOT ===
  const robot = new THREE.Group();

  const bodyGeometry = new THREE.BoxGeometry(2, 3, 1);
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5, roughness: 0.4 });
  const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
  body.position.set(0, 1.5, 0);
  robot.add(body);

  const headGeometry = new THREE.SphereGeometry(0.75, 32, 32);
  const headMaterial = new THREE.MeshStandardMaterial({ color: 0xffcccc, metalness: 0.3, roughness: 0.5 });
  const head = new THREE.Mesh(headGeometry, headMaterial);
  head.position.set(0, 3.25, 0);
  robot.add(head);

  const armGeometry = new THREE.CylinderGeometry(0.2, 0.2, 1.5, 16);
  const armMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5, roughness: 0.4 });
  const leftArm = new THREE.Mesh(armGeometry, armMaterial);
  leftArm.rotation.z = Math.PI / 2; leftArm.position.set(-1.3, 2, 0); robot.add(leftArm);
  const rightArm = new THREE.Mesh(armGeometry, armMaterial);
  rightArm.rotation.z = Math.PI / 2; rightArm.position.set(1.3, 2, 0); robot.add(rightArm);

  const legGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16);
  const legMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.2, roughness: 0.7 });
  const leftLeg = new THREE.Mesh(legGeometry, legMaterial); leftLeg.position.set(-0.5, 0.75, 0); robot.add(leftLeg);
  const rightLeg = new THREE.Mesh(legGeometry, legMaterial); rightLeg.position.set(0.5, 0.75, 0); robot.add(rightLeg);

  robot.position.set(0, 0, 0);
  scene.add(robot);
  let robotBox = new THREE.Box3().setFromObject(robot);

  // === GOAL POST ===
  let goalMesh = null;
  let goalBox = null;
  function setGoalAt(pos) {
    if (!goalMesh) {
      const pole = new THREE.CylinderGeometry(0.2, 0.2, 3, 16);
      const poleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const flag = new THREE.BoxGeometry(1.5, 0.8, 0.05);
      const flagMat = new THREE.MeshStandardMaterial({ color: 0x00ccff });

      const goalGroup = new THREE.Group();
      const poleMesh = new THREE.Mesh(pole, poleMat);
      poleMesh.position.set(0, 1.5, 0);
      const flagMesh = new THREE.Mesh(flag, flagMat);
      flagMesh.position.set(0.9, 2.2, 0);
      goalGroup.add(poleMesh); goalGroup.add(flagMesh);

      goalMesh = goalGroup;
      scene.add(goalMesh);
      goalBox = new THREE.Box3().setFromObject(goalMesh);
    }
    goalMesh.position.set(pos.x, pos.y ?? 0, pos.z);
    goalBox.setFromObject(goalMesh);
  }

  // Set initial and goal positions
  const initialPos = { x: 0, z: 0 };
  const goalPos = { x: 40, z: 40 };
  
  robot.position.set(initialPos.x, 0, initialPos.z);
  setGoalAt({ x: goalPos.x, y: 0, z: goalPos.z });
  
  const goalMarkerGeometry = new THREE.CylinderGeometry(2, 2, 0.1, 32);
  const goalMarkerMaterial = new THREE.MeshBasicMaterial({ 
    color: 0x00ff00,
    transparent: true,
    opacity: 0.8
  });
  const goalMarker = new THREE.Mesh(goalMarkerGeometry, goalMarkerMaterial);
  goalMarker.position.set(goalPos.x, 0.05, goalPos.z);
  scene.add(goalMarker);
  
  // Arrow helper removed for cleaner look

  // === AI and MOVEMENT LOGIC ===

  function calculateOptimalHeading() {
    const PREDICTION_TIME = 2.5; // seconds to look ahead
    const GOAL_ATTRACTION_FORCE = 5;
    const OBSTACLE_REPULSION_FORCE = 150;
    const SAFE_DISTANCE = 6.0;

    // 1. Attractive force from the goal
    let finalVector = new THREE.Vector3(
        simState.goalPosition.x - robot.position.x,
        0,
        simState.goalPosition.z - robot.position.z
    );

    // If we are very close to the goal, don't do complex avoidance
    if (finalVector.length() < SAFE_DISTANCE) {
        return finalVector.normalize();
    }
    finalVector.normalize().multiplyScalar(GOAL_ATTRACTION_FORCE);


    // 2. Repulsive forces from obstacles
    for (let i = 0; i < obstacles.length; i++) {
        const obs = obstacles[i];
        const vel = movingObstacles.velocities[i];
        if (!vel) continue;

        // Predict future position of the obstacle
        const futureObsPos = obs.position.clone();
        futureObsPos.x += vel.x * movingObstacles.speed * PREDICTION_TIME * 15; // Heuristic multiplier
        futureObsPos.z += vel.z * movingObstacles.speed * PREDICTION_TIME * 15;

        const vecToFutureObs = new THREE.Vector3().subVectors(robot.position, futureObsPos);
        const distance = vecToFutureObs.length();

        if (distance < SAFE_DISTANCE * 2) {
            // Calculate how much of a "threat" this obstacle is.
            // Threat is higher if the obstacle is moving towards the robot.
            const robotToObs = new THREE.Vector3().subVectors(obs.position, robot.position);
            const obsVelocityVec = new THREE.Vector3(vel.x, 0, vel.z);
            const closingSpeed = robotToObs.normalize().dot(obsVelocityVec);

            // Repulsion is strongest when close and moving towards us
            const threatFactor = 1.0 + Math.max(0, closingSpeed); // Increase repulsion if obstacle is coming at us
            const repulsionStrength = OBSTACLE_REPULSION_FORCE * threatFactor / (distance * distance);
            
            vecToFutureObs.normalize().multiplyScalar(repulsionStrength);
            finalVector.add(vecToFutureObs);
        }
    }

    return finalVector.normalize();
  }


  function executeAIAction(optimalHeading) {
    if (optimalHeading === null) return;

    const speed = 0.1;
    const rotationSpeed = 0.08; // Slightly more agile turning

    // Find the angle the robot needs to be at
    const targetAngle = Math.atan2(optimalHeading.x, optimalHeading.z);

    // Find the current angle of the robot
    const robotForward = new THREE.Vector3(0, 0, 1).applyQuaternion(robot.quaternion);
    const currentAngle = Math.atan2(robotForward.x, robotForward.z);

    // Find the difference and handle wrapping
    let angleDiff = targetAngle - currentAngle;
    while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
    while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

    // Steer towards the target angle
    if (Math.abs(angleDiff) > 0.05) {
        robot.rotation.y += Math.sign(angleDiff) * rotationSpeed;
    }

    // Move forward, but slow down if turning sharply
    const turnFactor = Math.max(0.3, 1.0 - Math.abs(angleDiff) / Math.PI);
    robot.position.x += Math.sin(robot.rotation.y) * speed * turnFactor;
    robot.position.z += Math.cos(robot.rotation.y) * speed * turnFactor;
    
    const margin = 2;
    robot.position.x = Math.max(-45 + margin, Math.min(45 - margin, robot.position.x));
    robot.position.z = Math.max(-45 + margin, Math.min(45 - margin, robot.position.z));
  }

  function resetSimulation() {
    robot.position.set(initialPos.x, 0, initialPos.z);
    robot.rotation.set(0, 0, 0);
    simState.collisionCount = 0;
    updateCollisionHUD();
    body.material.color.set(0xff0000);

    // --- DYNAMIC GOAL ---
    // Generate a new random goal position far from the center
    let newGoalX, newGoalZ;
    do {
        newGoalX = Math.random() * 80 - 40; // Range -40 to 40
        newGoalZ = Math.random() * 80 - 40;
    } while (Math.sqrt(newGoalX * newGoalX + newGoalZ * newGoalZ) < 20); // Ensure it's at least 20 units away

    simState.goalPosition.x = newGoalX;
    simState.goalPosition.z = newGoalZ;

    // Update the visual goal markers
    setGoalAt({ x: newGoalX, y: 0, z: newGoalZ });
    goalMarker.position.set(newGoalX, 0.05, newGoalZ);

    // Automatically start the simulation
    simState.active = true;
    movingObstacles.enabled = true;
  }

  // === OBSTACLE MOTION STATE ===
  const clock = new THREE.Clock();
  const movingObstacles = {
    enabled: false, // Start disabled
    speed: 0.08,
    bounds: { minX: -40, maxX: 40, minZ: -40, maxZ: 40 },
    bounce: true,
    velocities: []
  };

  function buildVelocitiesArray(n) {
    const arr = new Array(n);
    for (let i = 0; i < n; i++) {
      const angle = Math.random() * Math.PI * 2;
      const baseSpeed = 0.3 + Math.random() * 0.4;
      arr[i] = {
        x: Math.cos(angle) * baseSpeed,
        z: Math.sin(angle) * baseSpeed,
        angle: angle,
        speed: baseSpeed
      };
    }
    return arr;
  }
  movingObstacles.velocities = buildVelocitiesArray(obstacles.length);

  function moveObstacles() {
    if (!movingObstacles.enabled) return;
    const s = movingObstacles.speed;
    const { minX, maxX, minZ, maxZ } = movingObstacles.bounds;
    
    obstacles.forEach((obs, i) => {
      const v = movingObstacles.velocities[i];
      if (!v) return;
      
      v.angle += (Math.random() - 0.5) * 0.1;
      v.x = Math.cos(v.angle) * v.speed;
      v.z = Math.sin(v.angle) * v.speed;
      
      obs.position.x += v.x * s;
      obs.position.z += v.z * s;
      
      if (obs.position.x <= minX || obs.position.x >= maxX) {
        v.angle = Math.PI - v.angle;
        obs.position.x = Math.max(minX, Math.min(maxX, obs.position.x));
      }
      if (obs.position.z <= minZ || obs.position.z >= maxZ) {
        v.angle = -v.angle;
        obs.position.z = Math.max(minZ, Math.min(maxZ, obs.position.z));
      }
      
      v.x = Math.cos(v.angle) * v.speed;
      v.z = Math.sin(v.angle) * v.speed;
      
      obs.boundingBox.setFromObject(obs);
      
      const speed = Math.sqrt(v.x * v.x + v.z * v.z);
      obs.material.color.setHSL(speed * 0.2, 1, 0.5);
    });
  }

  // === ANIMATION LOOP ===
  function animate() {
    requestAnimationFrame(animate);
    controls.update();

    if (simState.active) {
        const distanceToGoal = robot.position.distanceTo(new THREE.Vector3(simState.goalPosition.x, 0, simState.goalPosition.z));
        if (distanceToGoal > 1.5) {
            const optimalHeading = calculateOptimalHeading();
            executeAIAction(optimalHeading);
        } else {
            // --- GOAL REACHED ---
            // Flash green to signal success
            body.material.color.set(0x00ff00);
            // Automatically reset to the next challenge
            setTimeout(resetSimulation, 500);
        }
    }

    robotBox.setFromObject(robot);
    let hasCollision = false;
    for (const obs of obstacles) {
      if (robotBox.intersectsBox(obs.boundingBox)) {
        body.material.color.set(0xffff00);
        simState.collisionCount++;
        updateCollisionHUD();
        hasCollision = true;
        
        // On collision, perform a bounce back.
        robot.position.x -= Math.sin(robot.rotation.y) * 1.0; 
        robot.position.z -= Math.cos(robot.rotation.y) * 1.0;

        break;
      }
    }
    if (!hasCollision && simState.active) {
        body.material.color.set(0xff0000);
    }

    moveObstacles();

    if (goalMesh && robotBox.intersectsBox(goalBox.setFromObject(goalMesh))) {
        body.material.color.set(0x00ffff);
        simState.active = false;
        movingObstacles.enabled = false;
        setTimeout(resetSimulation, 2000);
    }

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
